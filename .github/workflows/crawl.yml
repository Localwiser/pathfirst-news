name: crawl

# Pathfirst crawl_v1.runner: every day at 06:00 Beijing (22:00 UTC), or by
# hand. Public sources only; the repository's own GITHUB_TOKEN commits the
# day's file back. No other secrets.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # A source that fails or times out is logged and skipped inside the script;
      # a day that fails the acceptance checks is not written.
      - name: Crawl
        run: bun run crawl

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          DATE=$(TZ=Asia/Shanghai date +%F)
          # [skip ci]: the Action's own commit must not start the check workflow again.
          git commit -m "news：${DATE} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
